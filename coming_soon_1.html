<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111110;--cream:#FAF7F2;--green:#3B5C4A;--mid:#8A8A80;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
html,body{height:100%}
body{font-family:var(--sans);background:var(--ink);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;-webkit-font-smoothing:antialiased}
.logo{font-family:var(--sans);font-weight:300;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(250,247,242,.35);margin-bottom:48px;opacity:0;animation:fadeUp .8s .2s forwards}
.headline{font-family:var(--serif);font-weight:300;font-size:clamp(3.5rem,14vw,10rem);line-height:.9;letter-spacing:.03em;color:var(--cream);margin-bottom:48px;opacity:0;animation:fadeUp .8s .5s forwards}
.headline em{font-style:italic;color:rgba(250,247,242,.35)}
.sub{font-size:14px;font-weight:300;color:rgba(250,247,242,.4);letter-spacing:.04em;line-height:1.8;max-width:36ch;margin-bottom:48px;opacity:0;animation:fadeUp .8s .8s forwards}
.divider{width:32px;height:1px;background:var(--green);margin:0 auto 48px;opacity:0;animation:fadeUp .8s 1s forwards;border:none}
.byline{font-family:var(--sans);font-weight:300;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(250,247,242,.25);opacity:0;animation:fadeUp .8s 1.1s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <p class="logo">First</p>
  <h1 class="headline">coming <em>soon.</em></h1>
  <p class="sub">Something is being made for the woman who deserves to come first.</p>
  <hr class="divider">
  <p class="byline">by Alexandria Tong</p>
</body>
</html>
